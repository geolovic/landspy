name: Publish to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check version and distribution contents
        run: |
          python - <<'PY'
          import pathlib, tarfile, zipfile
          from email.parser import BytesParser
          import os
          wheel, = pathlib.Path('dist').glob('*.whl')
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata, = [n for n in names if n.endswith('.dist-info/METADATA')]
              version = BytesParser().parsebytes(archive.read(metadata))['Version']
              assert not any('benchmarks' in pathlib.PurePosixPath(n).parts for n in names)
          source, = pathlib.Path('dist').glob('*.tar.gz')
          with tarfile.open(source) as archive:
              assert not any('benchmarks' in pathlib.PurePosixPath(n).parts for n in archive.getnames())
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/landspy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
