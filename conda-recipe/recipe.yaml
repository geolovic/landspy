schema_version: 1

context:
  version: "1.4.1"

package:
  name: landspy
  version: ${{ version }}

source:
  # Refresh from published PyPI metadata with update_source.py before submission.
  url: https://files.pythonhosted.org/packages/b5/f3/dcc6e08aefbb0fa52faa6eb7c51e2ea42792ec6d0e95315966a8f4113ad5/landspy-1.4.1.tar.gz
  sha256: b2f1dc8d82bad64a78c7391d87da0fd89c576f68c068e2fe5c2000fa7aa4e9c1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python 3.10.*
    - pip
    - setuptools >=77
  run:
    - python >=3.10
    - gdal
    - numpy
    - matplotlib-base
    - scikit-image
    - scipy
    - shapely >=2
    - numba >=0.53

tests:
  - python:
      imports:
        - landspy
      pip_check: true
  - script: python run_test.py
    files:
      recipe:
        - run_test.py

about:
  homepage: https://github.com/geolovic/landspy
  repository: https://github.com/geolovic/landspy
  summary: Python library for landscape analysis with DEMs
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - geolovic
