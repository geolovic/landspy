schema_version: 1

context:
  version: "1.4.0"

package:
  name: landspy
  version: ${{ version }}

source:
  # Refresh from published PyPI metadata with update_source.py before submission.
  url: https://pypi.org/packages/source/l/landspy/landspy-${{ version }}.tar.gz
  sha256: 9411e73d922a4172552f7711bde838ab6ee0e097bc6b605393d6db88cd72b0a0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python 3.10.*
    - pip
    - setuptools >=77
  run:
    - python >=3.10
    - gdal
    - numpy
    - matplotlib-base
    - scikit-image
    - scipy
    - shapely >=2
    - numba >=0.53

tests:
  - python:
      imports:
        - landspy
      pip_check: true
  - script: python run_test.py
    files:
      recipe:
        - run_test.py

about:
  homepage: https://github.com/geolovic/landspy
  repository: https://github.com/geolovic/landspy
  summary: Python library for landscape analysis with DEMs
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - geolovic
