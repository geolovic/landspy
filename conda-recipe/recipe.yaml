schema_version: 1

context:
  version: "1.4.0"

package:
  name: landspy
  version: ${{ version }}

source:
  # Refresh from published PyPI metadata with update_source.py before submission.
  url: https://files.pythonhosted.org/packages/44/a6/3989676385b94447bcd8e26497120c5d993423ff9516eda2367ab8d5ad38/landspy-1.4.0.tar.gz
  sha256: c148a12fb4eb6500db12501e83945ba425a487a105fa8301e04264e489cae03f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python 3.10.*
    - pip
    - setuptools >=77
  run:
    - python >=3.10
    - gdal
    - numpy
    - matplotlib-base
    - scikit-image
    - scipy
    - shapely >=2
    - numba >=0.53

tests:
  - python:
      imports:
        - landspy
      pip_check: true
  - script: python run_test.py
    files:
      recipe:
        - run_test.py

about:
  homepage: https://github.com/geolovic/landspy
  repository: https://github.com/geolovic/landspy
  summary: Python library for landscape analysis with DEMs
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - geolovic
